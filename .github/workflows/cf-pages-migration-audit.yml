name: Cloudflare Pages migration - read-only audit
on:
  push:
    branches: [ops/cf-pages-migration-20261009]
    paths: [.github/workflows/cf-pages-migration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect hosting inventory without modifying Cloudflare
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account='1a64a0a081ea758f72be8254030bdf11';
          if(!token || !account) {
            console.log('CREDENTIALS_AVAILABLE=false');
            process.exitCode=2;
          } else {
            console.log('CREDENTIALS_AVAILABLE=true');
            const hosts=['airport.openphuquoc.com','weather.openphuquoc.com','transit.openphuquoc.com','dash.openphuquoc.com','val.openphuquoc.com','phuquoccharter.com'];
            async function get(path) {
              try {
                const response=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
                const body=await response.json();
                const codes=(body.errors||[]).map(x=>x.code);
                console.log('API '+path.split('?')[0]+' http='+response.status+' success='+!!body.success+' errors='+codes.join(','));
                return response.ok&&body.success?body.result:null;
              }catch(e){console.log('API_NETWORK_ERROR '+path.split('?')[0]+' '+e.name);return null;}
            }
            const projects=await get('/accounts/'+account+'/pages/projects?per_page=100');
            if(projects) {
              for(const p of projects) {
                const ds=(p.domains||[]).filter(d=>hosts.includes(d));
                if(ds.length||/jotrip|openpq|airport|weather|transit|charter|dash/i.test(p.name)) {
                  console.log('PAGES name='+p.name+' domains='+ds.join(',')+' production='+String(p.production_branch||''));
                }
              }
            }
            const zones=await get('/zones?name=openphuquoc.com&per_page=20');
            for (const z of zones||[]) {
              const dns=await get('/zones/'+z.id+'/dns_records?per_page=100');
              for(const r of dns||[]) {
                if(!hosts.includes(r.name))continue;
                const dest=String(r.content||'').toLowerCase();
                const cls=dest.includes('.github.io')||dest.includes('185.199.')?'github_pages':dest.includes('.pages.dev')?'cloudflare_pages':dest.includes('.workers.dev')?'cloudflare_worker':'other';
                console.log('DNS host='+r.name+' type='+r.type+' proxied='+r.proxied+' target_type='+cls);
              }
            }
            const charterZones=await get('/zones?name=phuquoccharter.com&per_page=20');
            for (const z of charterZones||[]) {
              const dns=await get('/zones/'+z.id+'/dns_records?per_page=100');
              for(const r of dns||[]) {
                if(r.name!=='phuquoccharter.com')continue;
                const dest=String(r.content||'').toLowerCase();
                const cls=dest.includes('.github.io')||dest.includes('185.199.')?'github_pages':dest.includes('.pages.dev')?'cloudflare_pages':dest.includes('.workers.dev')?'cloudflare_worker':'other';
                console.log('DNS host='+r.name+' type='+r.type+' proxied='+r.proxied+' target_type='+cls);
              }
            }
          }
          NODE
