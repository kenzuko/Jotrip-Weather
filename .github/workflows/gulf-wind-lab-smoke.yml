name: Gulf Wind POC browser smoke

on:
  push:
    paths:
      - "gulf-wind-lab.html"
      - "gulf-wind-lab.css"
      - "gulf-wind-lab.js"
      - "gulf-wind-lab-smoke.mjs"
      - ".github/workflows/gulf-wind-lab-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/gulf-wind-http.log 2>&1 &
          echo $! >/tmp/gulf-wind-http.pid
          sleep 2

      - name: Run browser smoke
        id: smoke
        continue-on-error: true
        run: node gulf-wind-lab-smoke.mjs

      - name: Publish smoke diagnostics
        if: always()
        shell: bash
        run: |
          if [ ! -f /tmp/gulf-wind-smoke-result.json ]; then
            printf '%s\n' '{"ok":false,"stage":"workflow","failure":"smoke result file missing"}' > /tmp/gulf-wind-smoke-result.json
          fi

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/gulf-wind-smoke-result.json gulf-wind-lab-smoke-result.json
          git config user.name "jotrip-weather-smoke"
          git config user.email "jotrip-weather-smoke@users.noreply.github.com"
          git add gulf-wind-lab-smoke-result.json

          if ! git diff --cached --quiet; then
            git commit -m "test: record Gulf Wind smoke result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gulf-wind-lab-smoke
          path: |
            /tmp/gulf-wind-lab-mobile.png
            /tmp/gulf-wind-http.log
            /tmp/gulf-wind-smoke-result.json
          retention-days: 7

      - name: Enforce browser smoke
        if: always()
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/gulf-wind-smoke-result.json'))
          assert p.get('ok') is True, p
          PY
