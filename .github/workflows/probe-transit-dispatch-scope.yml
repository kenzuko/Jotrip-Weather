name: Probe existing authorized scheduler access to Transit
on:
  push:
    branches: ["audit/transit-dispatch-scope-20261001"]
    paths: [".github/workflows/probe-transit-dispatch-scope.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PAT: ${{ secrets.WEATHER_GITHUB_DISPATCH_TOKEN }}
    steps:
      - name: Read-only authorization check followed by safe overdue wake
        run: |
          node --input-type=module <<'JS'
          const pat=process.env.PAT;
          if(!pat)throw Error("Existing Weather dispatch token unavailable - no changes made");
          const root="https://api.github.com/repos/kenzuko/transit-jotrip/actions/workflows/update-transit.yml";
          const headers={Authorization:"Bearer "+pat,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"jotrip-cross-scheduler-scope-probe"};
          const r=await fetch(root+"/runs?per_page=1",{headers,signal:AbortSignal.timeout(12000)});
          console.log("Transit Actions authenticated run inventory HTTP",r.status);
          if(!r.ok)throw Error("Existing token cannot verify Transit run inventory");
          const h=await fetch("https://raw.githubusercontent.com/kenzuko/transit-jotrip/main/data/health.json?t="+Date.now(),{signal:AbortSignal.timeout(12000)});
          if(!h.ok)throw Error("Cannot safely inspect committed Transit health");
          const d=await h.json();
          const age=(Date.now()-Date.parse(d.generated_at||""))/60000;
          console.log("Transit snapshot age",Math.round(age),"minutes; ready:",d.ready);
          if(d.ready&&Number.isFinite(age)&&age>=0&&age<39){console.log("TRANSIT_SCOPE_READ_OK, no wake necessary");process.exit(0);}
          const runs=await r.json();
          if(runs.workflow_runs?.some(x=>x.status!=="completed")){console.log("TRANSIT_SCOPE_READ_OK, collector already active");process.exit(0);}
          const post=await fetch(root+"/dispatches",{method:"POST",headers,body:JSON.stringify({ref:"main"}),signal:AbortSignal.timeout(12000)});
          console.log("Transit scoped dispatch HTTP",post.status);
          if(post.status!==204)throw Error("CROSS_REPO_TRANSIT_DISPATCH_SCOPE_REQUIRED; no Weather change made");
          console.log("TRANSIT_CROSS_REPO_DISPATCH_AUTHORIZED");
          JS
