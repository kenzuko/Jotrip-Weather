name: Weather mirror dispatch permission check
on:
  push:
    paths:
      - ".github/workflows/probe-weather-mirror-dispatch.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WEATHER_DISPATCH_TOKEN: ${{ secrets.WEATHER_GITHUB_DISPATCH_TOKEN }}
    steps:
      - name: Probe permission and refresh mirror if authorized
        run: |
          test -n "$WEATHER_DISPATCH_TOKEN" || { echo "::error::GitHub dispatch token missing"; exit 1; }
          status=$(curl --retry 1 -sS -o /tmp/mirror-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEATHER_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kenzuko/Jotrip-Weather/actions/workflows/sync-weather-runtime.yml/dispatches \
            -d '{"ref":"main"}')
          echo "Mirror dispatch HTTP: $status"
          if [ "$status" = "204" ]; then echo "MIRROR_DISPATCH_AUTHORIZED"; exit 0; fi
          echo "::warning::The token does not yet have Actions write access to Jotrip-Weather. HTTP $status"
          exit 0
