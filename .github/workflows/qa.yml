name: Weather Lab QA

on:
  push:
    branches: [main, "fix/weather-*", "feat/weather-*"]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static site contract
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f weather-dashboard.css
          test -f weather-dashboard.js
          test -f weather-standalone-data.js
          test -f weather-live-config.js
          test -f weather-sw.js
          test -f weather-wind-guard.js
          test -f weather-gust-outlook.js
          test -f weather-alert-ledger.js
          test -f weather-alert-mirror.mjs
          grep -q "weather-gust-outlook.js" index.html
          grep -q "weather-wind-guard.js" index.html
          test -f weather-feedback.js
          test -f weather-feedback.css
          test -f weather-history.html
          test -f weather-manifest.webmanifest
          test -f CNAME
          test -f data/dashboard-data.json
          test -f data/nowcast.json
          test -f data/air-quality.json
          test -f data/tide.json
          test -f vendor/weather-dashboard-base.css
          test -f vendor/weather-dashboard-typography.css
          test -f vendor/weather-dashboard-enhancements.js
          test -f vendor/weather-dashboard-legacy.js
          test -f vendor/weather-dashboard-air-quality.js
          test -f vendor/weather-dashboard-tide.js
          test -f vendor/weather-dashboard-observation-status.js
          test -f vendor/weather-dashboard-history-link.js
          test -f vendor/weather-history.css
          test -f vendor/weather-history.js
          test -f cloudflare/weather-worker.js
          test -f cloudflare/wrangler.toml
          test -f cloudflare/schema.sql
          test "$(tr -d '\r\n ' < CNAME)" = "weather.openphuquoc.com"
          grep -q 'weather.openphuquoc.com' README.md
          grep -q '/vendor/weather-dashboard-base.css' weather-dashboard.css
          grep -q "'/feedback'" cloudflare/weather-worker.js
          grep -q 'weather_feedback' cloudflare/schema.sql
          grep -q 'weather-v2.js' index.html
          grep -q 'weather-v2.css' index.html
          grep -q 'weather-scene-v3.html' weather-v2.js
          grep -q 'BẢN ĐỒ JOTRIP' index.html
          grep -q 'data-layer="wind"' spatial-lab.html
          grep -q 'data-layer="rain"' spatial-lab.html
          grep -q 'data-layer="waves"' spatial-lab.html
          grep -q 'data-layer="storm"' spatial-lab.html
          grep -q 'rainModes' spatial-lab.html

      - name: Validate JavaScript syntax
        run: |
          node --check weather-dashboard.js
          node --check weather-v2.js
          node --check weather-model-coverage.mjs
          node weather-model-coverage.mjs --test
          node weather-today-decision.test.mjs weather-v2.js
          node --check weather-wind-guard.js
          node weather-wind-guard.test.mjs weather-wind-guard.js
          node --check weather-gust-outlook.js
          node weather-gust-outlook.test.mjs weather-gust-outlook.js
          node --check weather-alert-ledger.js
          node --check weather-alert-mirror.mjs
          node weather-alert-ledger.test.mjs weather-alert-ledger.js
          node weather-alert-mirror.mjs --dry-run
          node --check weather-scene-v3.js
          node --check weather-scene-render-v2.js
          node --check spatial-lab.js
          node --check weather-standalone-data.js
          node --check weather-live-config.js
          node --check weather-feedback.js
          node --check weather-sw.js
          node --check vendor/weather-dashboard-legacy.js
          node --check vendor/weather-dashboard-enhancements.js
          node --check vendor/weather-dashboard-air-quality.js
          node --check vendor/weather-dashboard-tide.js
          node --check vendor/weather-dashboard-observation-status.js
          node --check vendor/weather-dashboard-history-link.js
          node --check vendor/weather-history.js
          node --input-type=module --check < cloudflare/weather-worker.js

      - name: Validate manifest and mirrored data
        run: |
          python -m json.tool weather-manifest.webmanifest >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('data/dashboard-data.json',encoding='utf-8'))
          assert d.get('report_status')=='LIVE'
          assert isinstance(d.get('points'),dict) and d['points']
          for name in ('nowcast.json','air-quality.json','tide.json'):
              p=json.load(open('data/'+name,encoding='utf-8'))
              assert p.get('status')=='POINT_NUMERIC_READY', (name,p.get('status'))
          # Four weather fields at one valid time, checked at every
          # locality; never silently fill in missing waves or gusts with 0.
          bundle=json.load(open('data/current-bundle.json',encoding='utf-8'))
          series=(bundle.get('model_72h') or {}).get('points') or {}
          # Some previously mirrored ECMWF hours legitimately have no gust.
          # Older snapshots predate explicit gap metadata. New mirrors must
          # declare missing gusts, and all mirrors retain the valid hours.
          from datetime import datetime, timezone
          issued=datetime.fromisoformat(str(bundle.get('generated_at','')).replace('Z','+00:00'))
          legacy=issued<datetime(2026,9,24,13,10,tzinfo=timezone.utc)
          for point in ('duong_dong','an_thoi','ganh_dau','cua_can','bai_thom','ham_ninh','bai_sao','rach_gia'):
              rows=series.get(point) or []
              assert rows, f'{point}: missing hourly marine series'
              available=0
              for row in rows:
                  assert row.get('time'), f'{point}: valid time missing'
                  for field in ('rain_3h_mm','wind_kmh','wave_hs_m'):
                      assert row.get(field) is not None, f'{point}: {field} missing at {row.get("time")}'
                  if row.get('gust_kmh') is not None:
                      available+=1
                  elif legacy:
                      print(f'legacy unflagged gust gap: {point} at {row["time"]}')
                  else:
                      assert 'gust_kmh' in (row.get('missing_fields') or []), (
                          f'{point}: missing gust must be explicitly declared at {row["time"]}')
                      assert row.get('data_quality')=='PARTIAL_MODEL', f'{point}: missing gust quality flag'
                  assert row.get('data_class')=='MODEL_ONLY', f'{point}: forecast mislabeled as observation'
              assert available/len(rows)>=0.8, f'{point}: gust coverage below 80%'
          print('local mirror, 8-point marine provenance and gust completeness OK')
          PY

      - name: Validate live Weather origin contracts
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/kenzuko/Jotrip-Lab/feat/weather-lab-data-engine-v1/weather'
          for file in dashboard-data.json tide.json nowcast.json air-quality.json; do
            curl -fsSL --retry 3 --retry-delay 2 "$base/$file" -o "/tmp/$file"
            python - "$file" <<'PY'
          import json,sys
          name=sys.argv[1]
          with open('/tmp/'+name,encoding='utf-8') as f:
              data=json.load(f)
          if name=='dashboard-data.json':
              assert data.get('report_status') in {'LIVE','DELAYED','UNAVAILABLE'}
              assert isinstance(data.get('points'),dict) and data['points']
          else:
              assert data.get('status') in {'POINT_NUMERIC_READY','UNAVAILABLE','INITIALIZING'}
          print(name,'OK')
          PY
          done

      - name: Check production endpoint on scheduled/manual runs
        # Pushes are usually mirror/UI builds. Explicitly opt into a real
        # production audit by tagging a commit [production-audit].
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[production-audit]')
        shell: bash
        run: |
          set -euo pipefail
          # Keep downloaded pages on disk: curl | grep -q under pipefail can
          # return curl exit 23 (broken pipe) even for a healthy endpoint.
          # The homepage was renamed to Weather Intelligence in V2.
          curl -fsSL --retry 4 --retry-delay 5 https://weather.openphuquoc.com/ -o /tmp/weather-production-home.html
          grep -Eq 'JoTrip Weather (Intelligence|Lab)' /tmp/weather-production-home.html
          curl -fsSL --retry 4 --retry-delay 5 https://weather.openphuquoc.com/data/dashboard-data.json -o /tmp/weather-production-dashboard.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/weather-production-dashboard.json'))
          assert p['report_status']=='LIVE' and p['points']
          PY
          curl -fsSL --retry 4 --retry-delay 5 https://weather.openphuquoc.com/weather-history.html -o /tmp/weather-production-history.html
          grep -q 'Lịch sử' /tmp/weather-production-history.html
          # The live Worker has its own dispatch token, independent from
          # the public GitHub Pages runtime and its mirror schedule.
          curl -fsSL --retry 4 --retry-delay 5 https://jotrip-weather-fresh.kenzuko.workers.dev/health -o /tmp/weather-worker-health.json
          curl -fsSL --retry 4 --retry-delay 5 https://jotrip-weather-fresh.kenzuko.workers.dev/local-now.json -o /tmp/weather-worker-local.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          health=json.load(open('/tmp/weather-worker-health.json'))
          local=json.load(open('/tmp/weather-worker-local.json'))
          assert health.get('ok') and health.get('cron_configured'), 'Cloudflare dispatch secret missing'
          assert local.get('engine')=='PQ_LOCAL_NOW_V2' and local.get('points'), 'live ground truth not available'
          at=datetime.fromisoformat(local['generated_at'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-at).total_seconds()/60
          assert -10 <= age <= 35, f'Ground truth {age:.1f}m old at Cloudflare gateway'
          print('Cloudflare gateway OK; Ground Truth age',round(age,1),'min')
          PY
          # Verify that the same-origin canonical runtime is actually published.
          curl -fsSL --retry 4 --retry-delay 5 https://weather.openphuquoc.com/data/weather-runtime/manifest.json -o /tmp/weather-production-manifest.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p=json.load(open('/tmp/weather-production-manifest.json'))
          assert p['status']=='READY'
          assert p['policy']['frontend_source']=='SAME_ORIGIN_CANONICAL_ONLY'
          for name in ('cloud','compact','current','forecast','marine','meta'):
              assert p['files'][name].startswith('/data/weather-runtime/'), name
          t=p.get('source_times') or {}
          for name in ('cloud_sampled_time','marine_sampled_time'):
              assert t.get(name), name
          cloud=datetime.fromisoformat(t['cloud_sampled_time'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-cloud).total_seconds()/60
          assert -10 <= age <= 60, f'Himawari observation is {age:.1f}m old'
          print('production canonical runtime OK; Himawari age',round(age,1),'min')
          PY
