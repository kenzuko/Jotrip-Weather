name: Spatial production browser smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "weather-v2.js"
      - "weather-v2.css"
      - "spatial-lab.html"
      - "spatial-lab.css"
      - "spatial-lab.js"
      - "spatial-production-smoke.mjs"
      - ".github/workflows/spatial-production-smoke.yml"

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Allow CDN edge to settle
        run: sleep 45
      - name: Test live custom domain
        run: node spatial-production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-production-smoke
          path: |
            /tmp/prod-*.png
            /tmp/spatial-production-result.json
          retention-days: 7
