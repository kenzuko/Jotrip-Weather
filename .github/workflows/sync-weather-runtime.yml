              monotonic=(not old_ts or not new_ts or new_ts>=old_ts)
              if valid and monotonic:
                  write(name,payload)
              elif not oldp:
                  raise SystemExit(f'Refusing to create {name} mirror from invalid payload')
              else:
                  print(f'Keeping last-good {name} mirror')

          # Seed the first paint with a validated last-good dashboard snapshot.
          dashboard=json.loads((out/'dashboard-data.json').read_text(encoding='utf-8'))
          js=(
              "// Generated from validated Weather mirror. Do not hand-edit bootstrap payload.\n"
              "window.JOTRIP_WEATHER_LIVE_API_URL = 'https://jotrip-weather-live.kenzuko.workers.dev';\n"
              "window.JOTRIP_WEATHER_BOOTSTRAP = "
              + json.dumps(dashboard,ensure_ascii=False,separators=(',',':'))
              + ";\n"
          )
          Path('weather-live-config.js').write_text(js,encoding='utf-8')
          PY

