name: Weather gust layout visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "weather-v2.css"
      - ".github/workflows/weather-gust-layout-qa.yml"
  push:
    branches: [main, "fix/weather-*"]
    paths:
      - "index.html"
      - "weather-v2.css"
      - "weather-gust-layout.smoke.mjs"
      - ".github/workflows/weather-gust-layout-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and Safari-compatible WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Serve candidate branch and inspect responsive gust cards
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/weather-layout-http.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node weather-gust-layout.smoke.mjs /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-gust-layout-screenshots
          path: |
            /tmp/weather-visual-*.png
            /tmp/weather-layout-report.json
            /tmp/weather-layout-http.log
          retention-days: 7
