name: Weather Scene V3 flag timeline QA

on:
  workflow_dispatch:
  push:
    paths:
      - "weather-scene-v3.html"
      - "weather-scene-v3.js"
      - "weather-scene-v3-flag-timeline.mjs"
      - ".github/workflows/weather-scene-v3-flag-timeline.yml"

permissions:
  contents: read

jobs:
  production-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify selected point follows timeline
        run: node weather-scene-v3-flag-timeline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-scene-v3-flag-timeline
          path: /tmp/weather-scene-v3-flag-timeline.json
          retention-days: 7
