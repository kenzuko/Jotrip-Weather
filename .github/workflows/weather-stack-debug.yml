name: Weather canvas stacking debug

on:
  workflow_dispatch:
  push:
    paths:
      - "weather-stack-debug.mjs"
      - ".github/workflows/weather-stack-debug.yml"

permissions:
  contents: read

jobs:
  stacking:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node weather-stack-debug.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-stack-debug
          path: |
            /tmp/weather-stack-debug.json
            /tmp/baseline.png
            /tmp/z99999.png
            /tmp/shell.png
            /tmp/mapPaneSibling.png
          retention-days: 3
